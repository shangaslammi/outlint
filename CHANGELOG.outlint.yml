# Keep a Changelog structure for CHANGELOG.md, discovered automatically by
# `outlint check CHANGELOG.md` (per-document discovery, spec §11.2) and
# enforced by the CLI test suite.
version: 1

title: "Changelog"

sections:
  - id: unreleased
    match: "Unreleased"
    required: true
    strict: true
    sections: &categories
      - match: "Added"
        required: false
      - match: "Changed"
        required: false
      - match: "Deprecated"
        required: false
      - match: "Removed"
        required: false
      - match: "Fixed"
        required: false
      - match: "Security"
        required: false

  - id: release
    match: "/[0-9]+\\.[0-9]+\\.[0-9]+.*/"
    repeat: "1..n"
    strict: true
    sections: *categories
