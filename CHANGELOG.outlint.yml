# Keep a Changelog structure for CHANGELOG.md, discovered automatically by
# `outlint check CHANGELOG.md` (per-document discovery, spec §11.2) and
# enforced by the CLI test suite.
version: 1

options:
  strip_inline_markup: false

title: "Changelog"

content:
  - block: p
    repeat: "1..n"

sections:
  - id: unreleased
    match: "[Unreleased]"
    required: false
    unordered: true
    sections: &categories
      - match: "Added"
        required: false
        content: [{block: list, list_kind: bullet}]
        sections: []
      - match: "Changed"
        required: false
        content: [{block: list, list_kind: bullet}]
        sections: []
      - match: "Deprecated"
        required: false
        content: [{block: list, list_kind: bullet}]
        sections: []
      - match: "Removed"
        required: false
        content: [{block: list, list_kind: bullet}]
        sections: []
      - match: "Fixed"
        required: false
        content: [{block: list, list_kind: bullet}]
        sections: []
      - match: "Security"
        required: false
        content: [{block: list, list_kind: bullet}]
        sections: []

  - id: release
    match: '/\[(?<version>[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?)\] - (?<date>[0-9]{4}-[0-9]{2}-[0-9]{2})(?: \[YANKED\])?/'
    repeat: "1..n"
    captures: {version: semver, date: date}
    order:
      - {by: version, dir: desc, strict: true}
      - {by: date, dir: desc}
    unordered: true
    sections: *categories
