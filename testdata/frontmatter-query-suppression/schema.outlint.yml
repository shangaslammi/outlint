version: 2
# Suppression driven by a JSONPath boolean read (spec 4.6).
#
# A bare `fm[...]` is a typed boolean read: satisfied iff at least one result
# node is boolean true; boolean false, null, and an empty result are
# unsatisfied; and every non-boolean, non-null result node produces
# `invalid-value` and suppresses the entire containing constraint. 4.6 is
# explicit that a true sibling result or an already-true operand does not
# short-circuit that suppression, which the `any_of` here is arranged to test.
title: null
unordered: true
sections:
  - id: fallback
    match: Fallback
    required: false
extras: anywhere
constraints:
  - any_of: ["fm[$.flags[*]]", fallback]
