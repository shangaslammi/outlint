version: 1
# Every document here has two `h1`s, so each carries one `too-many-sections`
# on the second: bare `sections` implies `title: "*"`, exactly one `h1`.
# What the fixture pins is attribution. The surplus `h1` withdraws nothing —
# each `h1` binds its own child scopes — and a `missing-section` under one
# `Overview` names its full ancestor path, so same-named sections under
# different parents are never ambiguous: no scope pools them.
sections:
  - match: "Overview"
    repeat: "1..n"
    sections:
      - match: "Goals"
        required: true
