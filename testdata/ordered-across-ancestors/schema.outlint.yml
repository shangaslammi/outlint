version: 1
# The sugar `sections` scope is ordered by default (§3.7) and binds once per
# enclosing `h1`: occurrences are compared within one instance, so ordering
# never reaches across ancestors. `inverted.md` fires inside its one part;
# `across.md` inverts the same pair across two parts and each instance holds
# only one of the rules, so nothing is out of order — that document reports
# only the surplus `h1`. Cross-part ordering is the general form's business:
# `outline-parts-ordered/` orders the parts themselves.
sections:
  - match: "Intro"
  - match: "Body"
