version: 1
title: Changelog
content:
  - block: p
    repeat: "1..n"
sections:
  - id: release
    match: '/\[[0-9]+\.[0-9]+\.[0-9]+\] - [0-9]{4}-[0-9]{2}-[0-9]{2}/'
    repeat: "1..n"
    unordered: true
    sections:
      - match: Added
        required: false
        content: [{block: list, list_kind: bullet}]
        sections: []
      - match: Changed
        required: false
        content: [{block: list, list_kind: bullet}]
        sections: []
      - match: Deprecated
        required: false
        content: [{block: list, list_kind: bullet}]
        sections: []
      - match: Removed
        required: false
        content: [{block: list, list_kind: bullet}]
        sections: []
      - match: Fixed
        required: false
        content: [{block: list, list_kind: bullet}]
        sections: []
      - match: Security
        required: false
        content: [{block: list, list_kind: bullet}]
        sections: []
