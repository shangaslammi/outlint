version: 1
# Distinct h1 rules with distinct child scopes, plus constraints on the
# outline scope itself: `ordered` across h1 headers is expressible exactly
# because each ref path crosses only 0..1/1..1 ancestors (§5.1) — here the
# refs *are* the h1 rules. A violation targets the document: the virtual root
# has no header to name.
outline:
  - id: guide
    match: "Guide"
    required: true
    sections:
      - match: "Overview"
        required: true
  - id: appendix
    match: "Appendix"
    repeat: "0..1"
    sections:
      - match: "References"
constraints:
  - ordered: [guide, appendix]
