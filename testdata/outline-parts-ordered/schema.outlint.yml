version: 2
# Distinct h1 rules with distinct child scopes. The outline is an ordered
# consuming grammar (§3.2), so `# Guide` must precede `# Appendix` without a
# constraint. On inversion, recovery leaves `# Appendix` unassigned and emits
# a header-targeted `misplaced-section` (§3.5).
outline:
  - id: guide
    match: "Guide"
    required: true
    sections:
      - match: "Overview"
        required: true
    extras: anywhere
  - id: appendix
    match: "Appendix"
    repeat: "0..1"
    sections:
      - match: "References"
        repeat: "0..n"
    extras: anywhere
extras: anywhere
