version: 2
# Unordered so that only cardinality speaks here: in ordered mode, Beta's
# `Note three` after `Step two` would also be misplaced (§3.7).
unordered: true
sections:
  # Scopes bind per parent: each `h1` counts its own `Note`s and `Step`s.
  # `spread.md`'s four steps therefore conform — no single ancestor holds
  # more than two — while `Beta`'s second note exceeds `Beta`'s own `0..1`
  # budget, with the excess occurrence's path saying which parent. Nothing
  # is pooled across ancestors. Both documents also carry one
  # `too-many-sections` on the second `h1`: bare `sections` implies
  # `title: "*"`, exactly one `h1` — a document with real parts would
  # declare them with `outline:`.
  - id: notes
    match: "Note *"
    repeat: "0..1"
  - id: steps
    match: "Step *"
    repeat: "0..2"
extras: anywhere
