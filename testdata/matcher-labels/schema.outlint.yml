version: 2
title: null
sections:
  - id: steps
    match: "Step *"
    required: true
  - id: paths
    match: "/a\\/b/"
    required: true
  - id: container
    match: "Container"
    required: true
    sections:
      - match: "/item [0-9]+/"
        required: true
    extras: anywhere
  # The final wildcard phase consumes retained headers left after the preceding
  # ordered phases (§3.2).
  - id: anything
    match: "*"
    required: true
extras: anywhere
