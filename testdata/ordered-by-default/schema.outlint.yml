version: 2
# Nothing here says `unordered`: the `sections` list is an ordered grammar
# (§3.2).
# Unmatched headers match no rule and float freely in this open scope, and
# the guard removes matches before assignment, so only Overview, Usage, and
# the `API: *` sections take part.
title: "*"
sections:
  - match: "Overview"
    required: true
  - match: "Usage"
    required: false
  - match: "API: *"
    repeat: "0..n"
forbid_sections:
  - match: "Internal"
extras: anywhere
