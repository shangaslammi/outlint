version: 2
# The document root is a virtual level-0 section, so a top-level `h2` skips
# a level against it exactly as an `h4` directly under an `h2` would:
# `skipped-level` on the header itself, once per skipping sibling. A skipping
# header takes part in no rule — the pre-`h1` `Overview` here neither
# satisfies the rule nor counts toward its cardinality, which is why the `h1`
# that lacks an `Overview` of its own still reports the miss.
# `allow_skipped_levels` would instead admit such a header into the
# `sections` scope; these documents keep the default.
sections:
  - match: "Overview"
    required: true
extras: anywhere
