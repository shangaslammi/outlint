version: 1
# A document has at most one `h1`. If an `h1` exists, the root scope is its
# `h2` children; otherwise it is the document's own `h2`s. `required: true`
# therefore means "exactly one under the `h1`" here. A header outside that
# structure is `detached-section`, reported on the header itself, and takes
# part in no rule: it neither satisfies `Overview` nor counts toward its
# cardinality.
sections:
  - match: "Overview"
    required: true
