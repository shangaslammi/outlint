version: 1
# The root scope is flat: `sections` describes every `h2` in the document,
# pooled regardless of which `h1` encloses it. `required: true` therefore
# means "exactly one in the document" here. That pooling only has one meaning
# when every `h2` shares one ancestor chain, and bounding the document to one
# `h1` is not enough to guarantee it: an `h2` placed *before* the `h1` has no
# ancestor at all, so the scope would straddle two disjoint chains. Such a
# header is `detached-section`, reported on the header itself.
sections:
  - match: "Overview"
    required: true
