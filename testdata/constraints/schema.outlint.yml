version: 2
# The partial `ordered: [a, c]` below needs an unordered scope: an ordered
# scope already orders every rule in it and refuses the constraint as
# redundant.
title: null
unordered: true
sections:
  - id: a
    match: "A"
    required: false
  - id: b
    match: "B"
    required: false
  - id: c
    match: "C"
    required: false
extras: anywhere
constraints:
  - one_of: [a, b]
  - requires: { if: a, then: c }
  - conflicts: { if: b, then_not: c }
  - ordered: [a, c]
