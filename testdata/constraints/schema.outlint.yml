version: 1
# The partial `ordered: [a, c]` below needs an unordered scope: an ordered
# scope (the default) already orders every rule in it and refuses the
# constraint as redundant.
options:
  ordered_sections: false
title: null
sections:
  - id: a
    match: "A"
    required: false
  - id: b
    match: "B"
    required: false
  - id: c
    match: "C"
    required: false
constraints:
  - one_of: [a, b]
  - requires: { if: a, then: c }
  - conflicts: { if: b, then_not: c }
  - ordered: [a, c]
