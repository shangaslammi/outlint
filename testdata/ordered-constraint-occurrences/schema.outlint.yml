version: 2
# The explicit `ordered` constraint on an unordered scope, over repeating
# rules: §5.1's `last(A) < first(B)` compares every occurrence, so repeats
# may sit together but not straddle the next ref's occurrences. The
# implicit counterpart is `ordered-occurrences/`; the two are separate
# machinery sharing one definition.
title: null
unordered: true
sections:
  - id: a
    match: "A"
    repeat: "0..n"
  - id: b
    match: "B"
    repeat: "0..n"
extras: anywhere
constraints:
  - ordered: [a, b]
