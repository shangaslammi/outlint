version: 2
# Ordering mode is local in v2: the root and `Notes` opt into unordered
# classification, while `Steps` keeps the ordered default for its children.
title: "*"
unordered: true
sections:
  - match: "Steps"
    repeat: "0..n"
    sections:
      - match: "Install"
        repeat: "0..n"
      - match: "Configure"
        repeat: "0..n"
    extras: anywhere
  - match: "Notes"
    repeat: "0..n"
    unordered: true
    sections:
      - match: "Install"
        repeat: "0..n"
      - match: "Configure"
        repeat: "0..n"
    extras: anywhere
extras: anywhere
