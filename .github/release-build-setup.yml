- name: Select Git Bash on Windows
  if: runner.os == 'Windows'
  shell: pwsh
  run: |
    $gitBashDir = Join-Path $env:ProgramFiles 'Git\bin'
    if (!(Test-Path (Join-Path $gitBashDir 'bash.exe'))) {
      throw "Git Bash was not found in $gitBashDir"
    }
    $gitBashDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
