- name: Put Git sh on PATH on Windows
  if: runner.os == 'Windows'
  shell: pwsh
  run: |
    $gitBinDir = Join-Path $env:ProgramFiles 'Git\bin'
    if (!(Test-Path (Join-Path $gitBinDir 'sh.exe'))) {
      throw "Git sh was not found in $gitBinDir"
    }
    $gitBinDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
