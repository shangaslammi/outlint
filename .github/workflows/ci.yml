name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.edition }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        edition: [check-only, full]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked ${{ matrix.edition == 'full' && '--all-features' || '--no-default-features' }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  doc:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --locked

  full:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo doc --workspace --no-deps --all-features --locked

  msrv:
    name: msrv (${{ matrix.edition }})
    strategy:
      fail-fast: false
      matrix:
        edition: [check-only, full]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked ${{ matrix.edition == 'full' && '--all-features' || '--no-default-features' }}

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  distribution:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-dist
        shell: bash
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh
      - name: Build both release editions
        run: dist build --artifacts=all --target=x86_64-unknown-linux-gnu
      - name: Verify archive checksums
        working-directory: target/distrib
        run: sha256sum --check outlint-x86_64-unknown-linux-gnu.tar.xz.sha256 outlint-full-x86_64-unknown-linux-gnu.tar.xz.sha256
      - name: Exercise the packaged binaries
        shell: bash
        run: |
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT
          mkdir -p "$smoke_dir/inputs"
          git init --quiet "$smoke_dir/inputs"
          printf 'version: 1\ntitle: Bundle\nsections: []\n' > "$smoke_dir/schema.yml"
          printf '# Bundle\n\nDistribution verification phrase.\n' > "$smoke_dir/inputs/doc.md"
          for edition in outlint outlint-full; do
            mkdir -p "$smoke_dir/$edition"
            tar -xf "target/distrib/$edition-x86_64-unknown-linux-gnu.tar.xz" \
              --strip-components=1 -C "$smoke_dir/$edition"
            "$smoke_dir/$edition/outlint" --help > "$smoke_dir/$edition/help.txt"
            "$smoke_dir/$edition/outlint" --version
            "$smoke_dir/$edition/outlint" check "$smoke_dir/inputs/doc.md" --schema "$smoke_dir/schema.yml"
          done
          if grep -Eq '^[[:space:]]*(search|read)[[:space:]]' "$smoke_dir/outlint/help.txt"; then
            echo 'The check-only archive includes optional commands' >&2
            exit 1
          fi
          "$smoke_dir/outlint-full/outlint" read "$smoke_dir/inputs/doc.md"
          "$smoke_dir/outlint-full/outlint" search --root "$smoke_dir/inputs" verification
