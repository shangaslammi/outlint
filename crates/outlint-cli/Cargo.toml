[package]
name = "outlint"
description = "Lint the header structure of Markdown documents against a schema"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/outlint"
keywords = ["markdown", "lint", "linter", "outline", "schema"]
categories = ["command-line-utilities", "text-processing", "development-tools"]

[[bin]]
name = "outlint"
path = "src/main.rs"

[dependencies]
outlint-core = { path = "../outlint-core", version = "0.1.0" }
serde_json = "1"
