[package]
name = "outlint"
description = "Lint the header structure of Markdown documents against a schema"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/outlint"
readme = "README.md"
keywords = ["markdown", "lint", "linter", "outline", "schema"]
categories = ["command-line-utilities", "text-processing", "development-tools"]
exclude = ["tests/"]

[[bin]]
name = "outlint"
path = "src/main.rs"

[dependencies]
outlint-core = { path = "../outlint-core", version = "0.2.0" }
serde_json = "1"
outlint-search = { path = "../outlint-search", version = "0.2.0", optional = true }

outlint-edit = { path = "../outlint-edit", version = "0.2.0", optional = true }
tempfile = { version = "3", optional = true }

[target.'cfg(windows)'.dependencies]
winapi-util = { version = "0.1", optional = true }

[features]
search = ["dep:outlint-search"]
read = []
edit = ["dep:outlint-edit", "dep:tempfile", "dep:winapi-util"]
full = ["search", "read", "edit"]

[package.metadata.dist]
# The original archives and npm bootstrap distribute the core linter.
default-features = false
all-features = false
features = []
