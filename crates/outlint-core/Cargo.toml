[package]
name = "outlint-core"
description = "Markdown outline schema validator (core library)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/outlint-core"
readme = "README.md"
keywords = ["markdown", "outline", "schema", "validation", "lint"]
categories = ["text-processing", "parser-implementations", "development-tools"]

[dependencies]
casefold = "0.1"
jsonschema = { version = "0.49.2", default-features = false, features = ["arbitrary-precision"] }
marked-yaml = "0.8"
num-bigint = "0.4"
pulldown-cmark = { version = "0.13", default-features = false }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
unicode-normalization = "0.1"
yaml-rust2 = "0.11"
yaml_serde = "0.10"

[dev-dependencies]
proptest = "1"
