# cargo-deny configuration; CI runs all four checks (advisories, bans,
# licenses, sources). The license allow list is the permissive set the
# current dependency graph actually uses — extend it deliberately, not
# preemptively, when a new dependency needs it.

[advisories]
version = 2
ignore = [
    # pulldown-cmark: quadratic parsing of nested image wikilinks. Only
    # reachable with `Options::ENABLE_WIKILINKS`, which Outlint never sets
    # (every parser is built with empty options).
    { id = "RUSTSEC-2026-0433", reason = "wikilinks extension is never enabled" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
