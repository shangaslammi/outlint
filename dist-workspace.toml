[workspace]
members = ["cargo:."]

# Config for 'dist' (cargo-dist). The release workflow this generates
# (.github/workflows/release.yml) ships pre-built binaries only: crates.io
# publishing is deliberately absent pending a decision on whether the release
# pipeline should run `cargo publish`. Until then, publishing stays manual.
[dist]
# The preferred dist version to use in CI (pinned exactly so releases are
# reproducible; `dist init` after bumping this regenerates the workflow)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
]
